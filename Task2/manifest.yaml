apiVersion: apps/v1
kind: Deployment
metadata:
  name: scaletest-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scaletest
  template:
    metadata:
      labels:
        app: scaletest
    spec:
      containers:
        - name: scaletest
          image: ghcr.io/yandex-practicum/scaletestapp@sha256:eff20ae3ae2d596375f9ed6d612a78d149a35a66cd2907ea90d7175ca918c993
          resources:
            limits:
              memory: "3Mi" 
          ports:
            - containerPort: 8080
            
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: scaletest-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: scaletest-deployment
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---

apiVersion: v1
kind: Service
metadata:
  name: scaletest-service
spec:
  type: NodePort
  selector:
    app: scaletest
  ports:
    - port: 8080
      targetPort: 8080
