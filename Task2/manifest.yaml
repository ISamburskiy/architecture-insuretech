apiVersion: apps/v1
kind: Deployment
metadata:
  name: scaletest-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scaletest
  template:
    metadata:
      labels:
        app: scaletest
    spec:
      containers:
        - name: scaletest
          image: ghcr.io/yandex-practicum/scaletestapp@sha256:eff20ae3ae2d596375f9ed6d612a78d149a35a66cd2907ea90d7175ca918c993
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: scaletest-service
spec:
  type: NodePort
  selector:
    app: scaletest
  ports:
    - port: 80
      targetPort: 80
